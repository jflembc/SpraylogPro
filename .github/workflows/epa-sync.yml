name: EPA Weekly Sync

on:
  schedule:
    # Monday 23:00 UTC ≈ 7:00 PM Eastern during standard time (not DST-perfect year-round).
    - cron: "0 23 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run (bypass Monday 7 PM ET gate)"
        required: false
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm i exceljs @supabase/supabase-js

      - name: Run EPA sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true && '1' || '') || '' }}
        run: node scripts/epa-sync.mjs
